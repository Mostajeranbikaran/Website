<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل مدیریت | مرکز توانمندسازی</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: var(--bg); }
        .hidden { display: none !important; }
        
        /* صفحه لاگین */
        .login-box { max-width: 400px; margin: 80px auto; background: white; padding: 40px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); text-align: center; }
        .login-box h2 { color: var(--primary); margin-bottom: 20px; font-size: 22px; }
        
        /* پنل اصلی */
        .admin-container { max-width: 1400px; margin: 40px auto; padding: 20px; }
        .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; flex-wrap: wrap; gap: 15px; }
        .admin-header h1 { color: var(--primary); font-size: 28px; font-weight: 900; }
        
        /* تب‌ها */
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; }
        .tab-btn { background: none; border: none; font-family: inherit; font-size: 16px; font-weight: bold; color: var(--muted); cursor: pointer; padding: 10px 20px; border-radius: 8px; transition: 0.3s; }
        .tab-btn.active { background: #eff6ff; color: var(--primary); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* دکمه‌ها */
        .btn-export { background: #10b981; color: white; padding: 12px 24px; border-radius: 8px; font-weight: bold; border: none; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; font-family: inherit; transition: 0.3s; text-decoration: none; }
        .btn-export:hover { background: #059669; }
        .btn-danger { background: #ef4444; color: white; padding: 12px 24px; border-radius: 8px; font-weight: bold; border: none; cursor: pointer; transition: 0.3s; font-family: inherit; }
        .btn-danger:hover { background: #dc2626; }

        /* جدول */
        .table-container { background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 1200px; }
        th { background: #f8fafc; padding: 15px; text-align: right; font-weight: 800; color: var(--text); border-bottom: 2px solid #e2e8f0; white-space: nowrap; }
        td { padding: 15px; border-bottom: 1px solid #e2e8f0; color: var(--muted); font-size: 14px; white-space: nowrap; }
        tr:hover td { background: #f8fafc; }
        .photo-link { color: var(--primary); text-decoration: none; font-weight: bold; }
        .photo-link:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <!-- صفحه لاگین -->
    <div id="login-section">
        <div class="login-box">
            <h2>ورود به پنل مدیریت</h2>
            <div class="form-group" style="margin-bottom: 15px; text-align: right;">
                <label>ایمیل ادمین</label>
                <input type="email" id="login-email" placeholder="ایمیل خود را وارد کنید" style="width: 100%; padding: 14px; border: 1px solid var(--border); border-radius: 10px; font-family: inherit;">
            </div>
            <div class="form-group" style="margin-bottom: 20px; text-align: right;">
                <label>رمز عبور</label>
                <input type="password" id="login-password" placeholder="رمز را وارد کنید" style="width: 100%; padding: 14px; border: 1px solid var(--border); border-radius: 10px; font-family: inherit;">
            </div>
            <button onclick="checkLogin()" class="btn btn-primary" style="width: 100%;">ورود</button>
            <p id="login-error" style="color: red; margin-top: 15px; font-weight: bold;"></p>
        </div>
    </div>

    <!-- پنل مدیریت -->
    <div id="dashboard-section" class="hidden">
        <div class="admin-container">
            <div class="admin-header">
                <h1>پنل مدیریت ثبت‌نامی‌ها</h1>
                <div style="display: flex; gap: 10px;">
                    <a href="index.html" class="btn-export" style="background: var(--primary);"><i class="fas fa-arrow-right"></i> بازگشت به فرم</a>
                    <button onclick="logout()" class="btn-danger"><i class="fas fa-sign-out-alt"></i> خروج</button>
                </div>
            </div>

            <!-- تب‌ها -->
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('members')">مدیریت ثبت‌نامی‌ها</button>
                <button class="tab-btn" onclick="switchTab('settings')">تغییر رمز عبور</button>
            </div>

            <!-- تب ثبت‌نامی‌ها -->
            <div id="members-tab" class="tab-content active">
                <div style="margin-bottom: 15px;">
                    <button onclick="exportToCSV()" class="btn-export"><i class="fas fa-file-excel"></i> خروجی اکسل</button>
                </div>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>ردیف</th>
                                <th>نوع عضویت</th>
                                <th>نام و نام خانوادگی</th>
                                <th>کد ملی</th>
                                <th>شماره همراه</th>
                                <th>وضعیت مسکن</th>
                                <th>شغل</th>
                                <th>تحصیلات</th>
                                <th>تاریخ ثبت</th>
                                <th>عکس</th>
                            </tr>
                        </thead>
                        <tbody id="table-body"></tbody>
                    </table>
                </div>
            </div>

            <!-- تب تغییر رمز -->
            <div id="settings-tab" class="tab-content">
                <div class="login-box" style="margin: 20px auto; text-align: right;">
                    <h2 style="text-align: center;">تغییر رمز عبور</h2>
                    <p style="color: var(--muted); margin-bottom: 20px; font-size: 14px; text-align: center;">رمز جدید خود را وارد کنید. این رمز در سیستم امنیتی Supabase ذخیره می‌شود.</p>
                    
                    <div class="form-group" style="margin-bottom: 15px;">
                        <label>رمز عبور جدید</label>
                        <input type="password" id="new-password" placeholder="رمز جدید (حداقل ۶ کاراکتر)" style="width: 100%; padding: 14px; border: 1px solid var(--border); border-radius: 10px; font-family: inherit;">
                    </div>
                    
                    <button onclick="changePassword()" class="btn btn-primary" style="width: 100%;">ذخیره رمز جدید</button>
                    <p id="settings-msg" style="margin-top: 15px; font-weight: bold; text-align: center;"></p>
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://almalzhslughrfqsthi.supabase.co'; 
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFsbWFsemhzbHVnaHJmcXN0aGlvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI3NjgxMDcsImV4cCI6MjEwODM0NDEwN30.IDFFy8WZ8r3hxlOCAwFbsOFkXuwHvvs3Sw8UeIGrc1k';
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let allMembers = [];

        // بررسی لاگین
        async function checkLogin() {
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            const err = document.getElementById('login-error');
            err.innerText = "در حال بررسی...";
            
            const { data, error } = await supabase.auth.signInWithPassword({ email, password });
            
            if (error) {
                err.innerText = "ایمیل یا رمز عبور اشتباه است!";
            } else {
                err.innerText = "";
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('dashboard-section').classList.remove('hidden');
                loadMembers();
            }
        }

        // خروج
        async function logout() {
            await supabase.auth.signOut();
            document.getElementById('login-section').classList.remove('hidden');
            document.getElementById('dashboard-section').classList.add('hidden');
            document.getElementById('login-email').value = '';
            document.getElementById('login-password').value = '';
        }

        // تب‌ها
        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabName + '-tab').classList.add('active');
            event.target.classList.add('active');
        }

        // تغییر رمز
        async function changePassword() {
            const newPass = document.getElementById('new-password').value;
            const msg = document.getElementById('settings-msg');

            if (newPass.length < 6) {
                msg.style.color = "red";
                msg.innerText = "رمز باید حداقل ۶ کاراکتر باشد!";
                return;
            }

            const { error } = await supabase.auth.updateUser({ password: newPass });

            if (error) {
                msg.style.color = "red";
                msg.innerText = "خطا در تغییر رمز: " + error.message;
            } else {
                msg.style.color = "green";
                msg.innerText = "✅ رمز عبور با موفقیت تغییر کرد!";
                document.getElementById('new-password').value = '';
            }
        }

        // لود ثبت‌نامی‌ها
        async function loadMembers() {
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '<tr><td colspan="10" style="text-align:center;">در حال بارگذاری...</td></tr>';
            
            const { data, error } = await supabase.from('members').select('*').order('created_at', { ascending: false });

            if (error) {
                tbody.innerHTML = `<tr><td colspan="10" style="text-align:center; color:red;">خطا: ${error.message}</td></tr>`;
                return;
            }

            allMembers = data;
            tbody.innerHTML = '';

            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="10" style="text-align:center; padding: 40px;">هنوز کسی ثبت‌نام نکرده است.</td></tr>';
                return;
            }

            data.forEach((item, index) => {
                const date = new Date(item.created_at).toLocaleDateString('fa-IR');
                const photo = item.photo_url ? `<a href="${item.photo_url}" target="_blank" class="photo-link">مشاهده</a>` : '-';
                
                tbody.innerHTML += `
                    <tr>
                        <td>${index + 1}</td>
                        <td><strong>${item.membership_type}</strong></td>
                        <td>${item.first_name} ${item.last_name}</td>
                        <td>${item.national_id}</td>
                        <td>${item.mobile}</td>
                        <td>${item.housing_status || '-'}</td>
                        <td>${item.job || '-'}</td>
                        <td>${item.education || '-'}</td>
                        <td>${date}</td>
                        <td>${photo}</td>
                    </tr>
                `;
            });
        }

        // خروجی اکسل
        function exportToCSV() {
            if (allMembers.length === 0) { alert("داده‌ای وجود ندارد!"); return; }

            const headers = ["نوع عضویت", "نام", "نام خانوادگی", "کد ملی", "تاریخ تولد", "وضعیت تاهل", "تعداد فرزندان", "آدرس", "کد پستی", "شماره همراه", "تلفن ثابت", "وضعیت مسکن", "شغل", "تحصیلات", "کد بیمه", "بیمه تکمیلی", "لینک عکس", "تاریخ ثبت"];
            let csvContent = "\uFEFF" + headers.join(",") + "\n";

            allMembers.forEach(item => {
                const row = [
                    item.membership_type, item.first_name, item.last_name, item.national_id,
                    item.birth_date || "", item.marital_status || "", item.children || "",
                    `"${item.address}"`, item.postal_code || "", item.mobile, item.landline || "",
                    item.housing_status || "", item.job || "", item.education || "",
                    item.social_security || "", item.supplementary_insurance || "",
                    item.photo_url || "", new Date(item.created_at).toLocaleDateString('fa-IR')
                ];
                csvContent += row.join(",") + "\n";
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = "members_export.csv";
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
