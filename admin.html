<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل مدیریت | مرکز توانمندسازی</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { background: #f8fafc; display: block; }
        
        /* استایل لاگین */
        .login-wrapper { display: flex; justify-content: center; align-items: center; min-height: 80vh; }
        .login-card { background: white; padding: 40px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); width: 100%; max-width: 400px; text-align: center; }
        .login-card h2 { color: #1e3a8a; margin-bottom: 25px; }
        .login-card input { width: 100%; padding: 15px; border: 2px solid #e2e8f0; border-radius: 10px; font-family: inherit; font-size: 16px; margin-bottom: 15px; text-align: left; }
        .login-card input:focus { outline: none; border-color: #1e3a8a; }
        .login-card button { width: 100%; padding: 15px; background: #1e3a8a; color: white; border: none; border-radius: 10px; font-family: inherit; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .login-card button:hover { background: #152c6b; }
        .error-text { color: #ef4444; font-weight: bold; margin-top: 15px; font-size: 14px; }

        /* استایل پنل */
        .dashboard-wrapper { display: none; max-width: 1200px; margin: 40px auto; padding: 20px; }
        .dash-header { display: flex; justify-content: space-between; align-items: center; background: white; padding: 20px 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 30px; }
        .dash-header h1 { color: #1e3a8a; font-size: 24px; margin: 0; }
        .logout-btn { background: #ef4444; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; font-family: inherit; }
        .action-bar { margin-bottom: 20px; display: flex; justify-content: flex-end; }
        .excel-btn { background: #10b981; color: white; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-weight: bold; font-family: inherit; display: flex; align-items: center; gap: 8px; }
        .table-box { background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 800px; }
        th { background: #f8fafc; padding: 15px; text-align: right; font-weight: bold; color: #1e3a8a; border-bottom: 2px solid #e2e8f0; white-space: nowrap; }
        td { padding: 15px; border-bottom: 1px solid #e2e8f0; color: #475569; font-size: 14px; white-space: nowrap; }
        tr:hover td { background: #f8fafc; }
    </style>
</head>
<body>

    <!-- صفحه لاگین -->
    <div id="login-section" class="login-wrapper">
        <div class="login-card">
            <h2>ورود به پنل مدیریت</h2>
            <input type="email" id="email" placeholder="ایمیل ادمین (مثلاً tabriz2009@gmail.com)">
            <input type="password" id="password" placeholder="رمز عبور">
            <button onclick="login()">ورود به پنل</button>
            <p id="login-error" class="error-text"></p>
            <a href="index.html" style="display: block; margin-top: 20px; color: #64748b; text-decoration: none; font-size: 14px;">&rarr; بازگشت به سایت</a>
        </div>
    </div>

    <!-- پنل مدیریت -->
    <div id="dashboard-section" class="dashboard-wrapper">
        <div class="dash-header">
            <h1>مدیریت ثبت‌نامی‌ها</h1>
            <button onclick="logout()" class="logout-btn"><i class="fas fa-sign-out-alt"></i> خروج</button>
        </div>
        
        <div class="action-bar">
            <button onclick="downloadExcel()" class="excel-btn"><i class="fas fa-file-excel"></i> دانلود خروجی اکسل</button>
        </div>

        <div class="table-box">
            <table>
                <thead>
                    <tr>
                        <th>ردیف</th>
                        <th>نام</th>
                        <th>نام خانوادگی</th>
                        <th>شماره همراه</th>
                        <th>نوع عضویت</th>
                        <th>تاریخ ثبت</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <tr><td colspan="6" style="text-align:center;">در حال بارگذاری...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://almalzhslughrfqsthi.supabase.co'; 
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFsbWFsemhzbHVnaHJmcXN0aGlvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI3NjgxMDcsImV4cCI6MjEwODM0NDEwN30.IDFFy8WZ8r3hxlOCAwFbsOFkXuwHvvs3Sw8UeIGrc1k';
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        let dataList = []; 

        // ====== ورود با ایمیل و رمز Supabase ======
        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const error = document.getElementById('login-error');
            
            error.innerText = "در حال بررسی...";
            
            const { data, error: authError } = await supabase.auth.signInWithPassword({
                email: email,
                password: password,
            });

            if (authError) {
                error.innerText = "ایمیل یا رمز عبور اشتباه است!";
            } else {
                error.innerText = "";
                document.getElementById('login-section').style.display = 'none';
                document.getElementById('dashboard-section').style.display = 'block';
                fetchData(); // گرفتن اطلاعات
            }
        }

        // ====== خروج ======
        async function logout() {
            await supabase.auth.signOut();
            document.getElementById('login-section').style.display = 'flex';
            document.getElementById('dashboard-section').style.display = 'none';
            document.getElementById('email').value = '';
            document.getElementById('password').value = '';
        }

        // ====== دریافت اطلاعات ======
        async function fetchData() {
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">در حال دریافت اطلاعات...</td></tr>';

            const { data, error } = await supabase.from('members').select('*').order('created_at', { ascending: false });

            if (error) {
                tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:red;">خطا: ${error.message}</td></tr>`;
                return;
            }

            dataList = data;
            tbody.innerHTML = '';

            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">هنوز کسی ثبت‌نام نکرده است.</td></tr>';
                return;
            }

            data.forEach((item, index) => {
                const date = new Date(item.created_at).toLocaleDateString('fa-IR');
                tbody.innerHTML += `
                    <tr>
                        <td>${index + 1}</td>
                        <td>${item.first_name}</td>
                        <td>${item.last_name}</td>
                        <td>${item.mobile}</td>
                        <td>${item.membership_type}</td>
                        <td>${date}</td>
                    </tr>
                `;
            });
        }

        // ====== خروجی اکسل ======
        function downloadExcel() {
            if (dataList.length === 0) { alert("داده‌ای برای دانلود وجود ندارد!"); return; }

            const headers = ["نام", "نام خانوادگی", "کد ملی", "شماره همراه", "نوع عضویت", "تاریخ ثبت"];
            let csvContent = "\uFEFF" + headers.join(",") + "\n";

            dataList.forEach(item => {
                const date = new Date(item.created_at).toLocaleDateString('fa-IR');
                csvContent += [item.first_name, item.last_name, item.national_id, item.mobile, item.membership_type, date].join(",") + "\n";
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = "members_data.csv";
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
