<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل مدیریت</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: #f8fafc; }
        /* صفحه لاگین */
        .login-wrapper { display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .login-card { background: white; padding: 40px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        .login-card h2 { color: #1e3a8a; margin-bottom: 25px; }
        .login-card input { width: 100%; padding: 15px; border: 2px solid #e2e8f0; border-radius: 10px; font-family: inherit; font-size: 20px; margin-bottom: 20px; text-align: center; letter-spacing: 5px; }
        .login-card button { width: 100%; padding: 15px; background: #1e3a8a; color: white; border: none; border-radius: 10px; font-family: inherit; font-size: 16px; font-weight: bold; cursor: pointer; }
        
        /* پنل */
        #dashboard-section { display: none; max-width: 1200px; margin: 40px auto; padding: 20px; }
        .dash-header { display: flex; justify-content: space-between; align-items: center; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .dash-header h1 { color: #1e3a8a; margin: 0; font-size: 22px; }
        .logout-btn { background: #ef4444; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        
        .excel-btn { background: #10b981; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; margin-bottom: 15px; }
        
        .table-box { background: white; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 800px; }
        th { background: #f8fafc; padding: 15px; text-align: right; border-bottom: 2px solid #e2e8f0; color: #1e3a8a; }
        td { padding: 15px; border-bottom: 1px solid #e2e8f0; color: #475569; font-size: 14px; }
    </style>
</head>
<body>

    <!-- صفحه لاگین -->
    <div id="login-section" class="login-wrapper">
        <div class="login-card">
            <h2>ورود به پنل مدیریت</h2>
            <input type="password" id="password-input" placeholder="****">
            <button onclick="doLogin()">ورود به پنل</button>
            <p id="login-error" style="color: red; margin-top: 15px;"></p>
            <a href="index.html" style="display: block; margin-top: 20px; color: #64748b; text-decoration: none;">&rarr; بازگشت</a>
        </div>
    </div>

    <!-- پنل مدیریت -->
    <div id="dashboard-section">
        <div class="dash-header">
            <h1>مدیریت ثبت‌نامی‌ها</h1>
            <button onclick="doLogout()" class="logout-btn">خروج</button>
        </div>
        
        <button onclick="downloadExcel()" class="excel-btn"><i class="fas fa-file-excel"></i> دانلود اکسل</button>

        <div class="table-box">
            <table>
                <thead>
                    <tr>
                        <th>ردیف</th>
                        <th>نام</th>
                        <th>نام خانوادگی</th>
                        <th>شماره همراه</th>
                        <th>نوع عضویت</th>
                        <th>تاریخ ثبت</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <tr><td colspan="6" style="text-align:center;">در حال بارگذاری...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://almalzhslughrfqsthi.supabase.co'; 
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFsbWFsemhzbHVnaHJmcXN0aGlvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI3NjgxMDcsImV4cCI6MjEwODM0NDEwN30.IDFFy8WZ8r3hxlOCAwFbsOFkXuwHvvs3Sw8UeIGrc1k';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        
        let dataList = [];

        function doLogin() {
            const pass = document.getElementById('password-input').value;
            const error = document.getElementById('login-error');
            
            if (pass === '1234') {
                error.innerText = "";
                document.getElementById('login-section').style.display = 'none';
                document.getElementById('dashboard-section').style.display = 'block';
                fetchData();
            } else {
                error.innerText = "رمز عبور اشتباه است!";
            }
        }

        function doLogout() {
            document.getElementById('login-section').style.display = 'flex';
            document.getElementById('dashboard-section').style.display = 'none';
            document.getElementById('password-input').value = '';
        }

        async function fetchData() {
            const tbody = document.getElementById('table-body');
            const { data, error } = await supabase.from('members').select('*').order('created_at', { ascending: false });

            if (error) {
                tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:red;">خطا: ${error.message}</td></tr>`;
                return;
            }

            dataList = data;
            tbody.innerHTML = '';

            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">اطلاعاتی ثبت نشده است.</td></tr>';
                return;
            }

            data.forEach((item, index) => {
                const date = new Date(item.created_at).toLocaleDateString('fa-IR');
                tbody.innerHTML += `
                    <tr>
                        <td>${index + 1}</td>
                        <td>${item.first_name}</td>
                        <td>${item.last_name}</td>
                        <td>${item.mobile}</td>
                        <td>${item.membership_type}</td>
                        <td>${date}</td>
                    </tr>
                `;
            });
        }

        function downloadExcel() {
            if (dataList.length === 0) { alert("داده‌ای وجود ندارد!"); return; }

            const headers = ["نام", "نام خانوادگی", "کد ملی", "شماره همراه", "نوع عضویت", "تاریخ ثبت"];
            let csvContent = "\uFEFF" + headers.join(",") + "\n";

            dataList.forEach(item => {
                const date = new Date(item.created_at).toLocaleDateString('fa-IR');
                csvContent += [item.first_name, item.last_name, item.national_id, item.mobile, item.membership_type, date].join(",") + "\n";
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = "members_data.csv";
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
