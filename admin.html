<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل مدیریت مرکز توانمندسازی</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* استایل‌های اختصاصی این صفحه */
        body { background: #f8fafc; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; padding-top: 50px; }
        
        .container-box { background: white; padding: 40px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); width: 90%; max-width: 1200px; text-align: center; }
        
        /* استایل صفحه لاگین */
        #login-box { max-width: 400px; margin: 0 auto; }
        #login-box h2 { color: #1e3a8a; margin-bottom: 20px; }
        #login-box input { width: 100%; padding: 14px; border: 1px solid #cbd5e1; border-radius: 10px; font-family: inherit; margin-bottom: 15px; font-size: 16px; text-align: center; }
        #login-box button { width: 100%; padding: 14px; background: #1e3a8a; color: white; border: none; border-radius: 10px; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.3s; }
        #login-box button:hover { background: #152c6b; }
        
        /* استایل پنل */
        #panel-box { display: none; text-align: right; }
        .header-actions { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; flex-wrap: wrap; gap: 15px; }
        .header-actions h2 { color: #1e3a8a; margin: 0; }
        .header-actions button { padding: 10px 20px; border-radius: 8px; border: none; cursor: pointer; font-family: inherit; font-weight: bold; }
        .btn-danger { background: #ef4444; color: white; }
        .btn-excel { background: #10b981; color: white; margin-bottom: 15px; }
        
        /* استایل جدول */
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px 15px; text-align: right; border-bottom: 1px solid #e2e8f0; }
        th { background: #f8fafc; color: #0f172a; font-weight: bold; }
        td { color: #475569; font-size: 14px; }
    </style>
</head>
<body>

    <!-- صفحه لاگین -->
    <div id="login-box" class="container-box">
        <h2>ورود به پنل مدیریت</h2>
        <input type="password" id="password-input" placeholder="رمز عبور (1234)">
        <button onclick="login()">ورود به پنل</button>
        <p id="error-msg" style="color: red; margin-top: 15px; font-weight: bold;"></p>
    </div>

    <!-- پنل مدیریت (بعد از ورود) -->
    <div id="panel-box" class="container-box">
        <div class="header-actions">
            <h2>لیست ثبت‌نامی‌ها</h2>
            <button onclick="logout()" class="btn-danger">خروج</button>
        </div>
        
        <button onclick="downloadExcel()" class="btn-excel"><i class="fas fa-file-excel"></i> دانلود خروجی اکسل</button>
        
        <div style="overflow-x: auto;">
            <table id="data-table">
                <thead>
                    <tr>
                        <th>ردیف</th>
                        <th>نام</th>
                        <th>نام خانوادگی</th>
                        <th>شماره همراه</th>
                        <th>نوع عضویت</th>
                        <th>تاریخ ثبت</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <tr><td colspan="6" style="text-align:center;">در حال بارگذاری...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- اسکریپت Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // ====== کلیدهای Supabase (همونی که توی index.html گذاشتی) ======
        const SUPABASE_URL = 'https://almalzhslughrfqsthi.supabase.co'; 
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFsbWFsemhzbHVnaHJmcXN0aGlvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI3NjgxMDcsImV4cCI6MjEwODM0NDEwN30.IDFFy8WZ8r3hxlOCAwFbsOFkXuwHvvs3Sw8UeIGrc1k';
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let dataList = []; // برای ذخیره اطلاعات و خروجی اکسل

        // تابع ورود
        function login() {
            const pass = document.getElementById('password-input').value;
            const err = document.getElementById('error-msg');
            
            if (pass === '1234') {
                err.innerText = "";
                document.getElementById('login-box').style.display = 'none';
                document.getElementById('panel-box').style.display = 'block';
                loadData(); // بارگذاری اطلاعات از دیتابیس
            } else {
                err.innerText = "رمز عبور اشتباه است!";
            }
        }

        // تابع خروج
        function logout() {
            document.getElementById('login-box').style.display = 'block';
            document.getElementById('panel-box').style.display = 'none';
            document.getElementById('password-input').value = '';
        }

        // بارگذاری اطلاعات از دیتابیس
        async function loadData() {
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">در حال دریافت اطلاعات...</td></tr>';

            const { data, error } = await supabase.from('members').select('*').order('created_at', { ascending: false });

            if (error) {
                tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:red;">خطا: ${error.message}</td></tr>`;
                return;
            }

            dataList = data; // ذخیره برای اکسل
            tbody.innerHTML = '';

            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">هنوز کسی ثبت‌نام نکرده است.</td></tr>';
                return;
            }

            data.forEach((item, index) => {
                const date = new Date(item.created_at).toLocaleDateString('fa-IR');
                tbody.innerHTML += `
                    <tr>
                        <td>${index + 1}</td>
                        <td>${item.first_name}</td>
                        <td>${item.last_name}</td>
                        <td>${item.mobile}</td>
                        <td>${item.membership_type}</td>
                        <td>${date}</td>
                    </tr>
                `;
            });
        }

        // خروجی اکسل
        function downloadExcel() {
            if (dataList.length === 0) {
                alert("اطلاعاتی برای دانلود وجود ندارد!");
                return;
            }

            // ساخت ساختار CSV
            const headers = ["نام", "نام خانوادگی", "کد ملی", "شماره همراه", "نوع عضویت", "وضعیت مسکن", "شغل", "تحصیلات", "تاریخ ثبت"];
            let csvContent = "\uFEFF"; // برای نمایش صحیح فارسی در اکسل
            csvContent += headers.join(",") + "\n";

            dataList.forEach(item => {
                const date = new Date(item.created_at).toLocaleDateString('fa-IR');
                const row = [
                    item.first_name, item.last_name, item.national_id, item.mobile, 
                    item.membership_type, item.housing_status || "-", item.job || "-", item.education || "-", date
                ];
                csvContent += row.join(",") + "\n";
            });

            // دانلود فایل
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = "members_data.csv";
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
