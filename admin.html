<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>پنل ادمین</title>
    <style>
        body { font-family: sans-serif; background: #f0f0f0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .box { background: white; padding: 40px; border-radius: 10px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        input, button { padding: 10px; font-size: 16px; margin: 10px 0; width: 100%; box-sizing: border-box; border-radius: 5px; border: 1px solid #ccc; }
        button { background: #1e3a8a; color: white; border: none; cursor: pointer; }
        #msg { margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="box">
        <h2>ورود به پنل</h2>
        <input type="password" id="pass" placeholder="رمز عبور (1234)">
        <button onclick="check()">ورود</button>
        <p id="msg"></p>
    </div>

    <script>
        function check() {
            var p = document.getElementById('pass').value;
            var m = document.getElementById('msg');
            if (p === '1234') {
                m.style.color = 'green';
                m.innerText = '✅ رمز درست است! (کد کار می‌کند)';
            } else {
                m.style.color = 'red';
                m.innerText = '❌ رمز اشتباه است!';
            }
        }
    </script>
</body>
</html>
