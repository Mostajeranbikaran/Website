<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل مدیریت</title>
    <style>
        body { background-color: #f1f5f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: 'Vazirmatn', sans-serif; margin: 0; }
        .login-card { background: white; padding: 40px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 90%; max-width: 400px; text-align: center; }
        h2 { color: #1e3a8a; margin-bottom: 20px; }
        input { width: 100%; padding: 15px; border: 2px solid #e2e8f0; border-radius: 10px; font-size: 20px; text-align: center; margin-bottom: 20px; box-sizing: border-box; }
        button { width: 100%; padding: 15px; background: #1e3a8a; color: white; border: none; border-radius: 10px; font-size: 18px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>ورود به پنل</h2>
        
        <!-- این یک فرم ساده است که رمز را به صفحه dashboard.html می‌فرستد -->
        <form action="dashboard.html" method="GET">
            <input type="password" name="pass" placeholder="****" required>
            <button type="submit">ورود</button>
        </form>
        
        <a href="index.html" style="display: block; margin-top: 20px; color: #64748b; text-decoration: none;">بازگشت</a>
    </div>

</body>
</html>
