<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تست پنل</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px; background: #f0f0f0; }
        .box { background: white; padding: 30px; border-radius: 10px; display: inline-block; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { color: #1e3a8a; }
        .success { color: green; font-size: 20px; font-weight: bold; }
        .error { color: red; font-size: 20px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="box" id="box">
        <h1>در حال بررسی...</h1>
    </div>

    <script>
        // بررسی آدرس
        const urlParams = new URLSearchParams(window.location.search);
        const pass = urlParams.get('pass');
        const box = document.getElementById('box');

        if (pass === '1234') {
            box.innerHTML = '<h1 class="success">✅ تبریک! لینک درست است و شما وارد شدید.</h1>';
        } else {
            box.innerHTML = '<h1 class="error">❌ دسترسی غیرمجاز! لطفاً لینک را با ?pass=1234 باز کنید.</h1>';
        }
    </script>
</body>
</html>
