<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل مدیریت حرفه‌ای | مرکز توانمندسازی</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* استایل‌های اختصاصی پنل */
        body { background-color: #f1f5f9; margin: 0; padding: 0; }
        
        /* صفحه لاگین */
        .login-wrapper { display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .login-card { background: white; padding: 50px 40px; border-radius: 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.08); width: 100%; max-width: 420px; text-align: center; }
        .login-card h2 { color: #1e3a8a; margin-bottom: 30px; font-size: 26px; font-weight: 900; }
        .login-card input { width: 100%; padding: 16px; border: 2px solid #e2e8f0; border-radius: 12px; font-family: inherit; font-size: 22px; margin-bottom: 25px; text-align: center; letter-spacing: 8px; transition: 0.3s; }
        .login-card input:focus { outline: none; border-color: #1e3a8a; box-shadow: 0 0 0 4px rgba(30, 58, 138, 0.1); }
        .login-card button { width: 100%; padding: 16px; background: #1e3a8a; color: white; border: none; border-radius: 12px; font-family: inherit; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .login-card button:hover { background: #152c6b; transform: translateY(-2px); }
        .error-text { color: #ef4444; font-weight: bold; margin-top: 20px; font-size: 15px; }

        /* پنل اصلی */
        #dashboard-section { display: none; max-width: 1300px; margin: 40px auto; padding: 20px; }
        
        .dash-header { display: flex; justify-content: space-between; align-items: center; background: white; padding: 25px 35px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); margin-bottom: 30px; border: 1px solid #e2e8f0; }
        .dash-header h1 { color: #1e3a8a; font-size: 26px; margin: 0; font-weight: 900; }
        
        .action-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; flex-wrap: wrap; gap: 15px; }
        .btn-group { display: flex; gap: 15px; flex-wrap: wrap; }
        
        .excel-btn { background: #10b981; color: white; border: none; padding: 12px 24px; border-radius: 10px; cursor: pointer; font-weight: bold; font-family: inherit; display: flex; align-items: center; gap: 8px; transition: 0.3s; }
        .excel-btn:hover { background: #059669; transform: translateY(-2px); }
        
        .settings-btn { background: #64748b; color: white; border: none; padding: 12px 24px; border-radius: 10px; cursor: pointer; font-weight: bold; font-family: inherit; display: flex; align-items: center; gap: 8px; transition: 0.3s; }
        .settings-btn:hover { background: #475569; transform: translateY(-2px); }
        
        .logout-btn { background: #ef4444; color: white; border: none; padding: 12px 24px; border-radius: 10px; cursor: pointer; font-weight: bold; font-family: inherit; display: flex; align-items: center; gap: 8px; transition: 0.3s; }
        .logout-btn:hover { background: #dc2626; }

        /* فرم تغییر رمز */
        .change-pass-box { display: none; background: white; padding: 25px; border-radius: 16px; margin-bottom: 30px; border: 1px solid #e2e8f0; max-width: 400px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); }
        .change-pass-box h3 { color: #1e3a8a; margin-bottom: 20px; font-size: 20px; }
        .change-pass-box input { width: 100%; padding: 14px; margin-bottom: 15px; border: 1px solid #cbd5e1; border-radius: 10px; font-family: inherit; font-size: 16px; }
        .change-pass-box button { background: #1e3a8a; color: white; border: none; padding: 12px 20px; border-radius: 10px; cursor: pointer; font-family: inherit; font-weight: bold; width: 100%; }
        #pass-msg { margin-top: 15px; font-weight: bold; font-size: 15px; text-align: center; }

        /* جدول */
        .table-box { background: white; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); overflow-x: auto; border: 1px solid #e2e8f0; }
        table { width: 100%; border-collapse: collapse; min-width: 900px; }
        th { background: #f8fafc; padding: 18px 20px; text-align: right; font-weight: 900; color: #1e3a8a; border-bottom: 2px solid #e2e8f0; white-space: nowrap; }
        td { padding: 18px 20px; border-bottom: 1px solid #e2e8f0; color: #475569; font-size: 15px; white-space: nowrap; }
        tr:hover td { background: #f8fafc; }
        .empty-row td { text-align: center; padding: 50px; color: #94a3b8; }
    </style>
</head>
<body>

    <!-- صفحه لاگین -->
    <div id="login-section" class="login-wrapper">
        <div class="login-card">
            <h2>ورود به پنل</h2>
            <input type="password" id="password-input" placeholder="****" maxlength="10">
            <button onclick="doLogin()">ورود</button>
            <p id="login-error" class="error-text"></p>
            <a href="index.html" style="display: block; margin-top: 25px; color: #64748b; text-decoration: none; font-size: 15px; font-weight: bold;">&rarr; بازگشت به سایت</a>
        </div>
    </div>

    <!-- پنل مدیریت -->
    <div id="dashboard-section">
        <div class="dash-header">
            <h1>مدیریت ثبت‌نامی‌ها</h1>
            <button onclick="doLogout()" class="logout-btn"><i class="fas fa-sign-out-alt"></i> خروج</button>
        </div>
        
        <div class="action-bar">
            <div class="btn-group">
                <button onclick="downloadExcel()" class="excel-btn"><i class="fas fa-file-excel"></i> دانلود اکسل</button>
                <button onclick="togglePassBox()" class="settings-btn"><i class="fas fa-key"></i> تغییر رمز (در دیتابیس)</button>
            </div>
        </div>

        <!-- فرم تغییر رمز -->
        <div id="change-pass-box" class="change-pass-box">
            <h3>تغییر رمز عبور</h3>
            <input type="password" id="new-password" placeholder="رمز جدید (حداقل ۴ کاراکتر)">
            <button onclick="changePassword()">ذخیره رمز در دیتابیس</button>
            <p id="pass-msg"></p>
        </div>

        <div class="table-box">
            <table>
                <thead>
                    <tr>
                        <th>ردیف</th>
                        <th>نام</th>
                        <th>نام خانوادگی</th>
                        <th>شماره همراه</th>
                        <th>نوع عضویت</th>
                        <th>تاریخ ثبت</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <tr class="empty-row"><td colspan="6">در حال بارگذاری اطلاعات...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://almalzhslughrfqsthi.supabase.co'; 
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFsbWFsemhzbHVnaHJmcXN0aGlvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI3NjgxMDcsImV4cCI6MjEwODM0NDEwN30.IDFFy8WZ8r3hxlOCAwFbsOFkXuwHvvs3Sw8UeIGrc1k';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        
        let dataList = []; 

        // ورود
        async function doLogin() {
            const pass = document.getElementById('password-input').value;
            const error = document.getElementById('login-error');
            error.innerText = "در حال بررسی...";
            
            // گرفتن رمز از دیتابیس
            const { data, error: dbError } = await supabase.from('settings').select('value').eq('key', 'admin_password').single();
            
            if (dbError || !data) {
                error.innerText = "خطا در اتصال به دیتابیس!";
                return;
            }
            
            if (pass === data.value) {
                error.innerText = "";
                document.getElementById('login-section').style.display = 'none';
                document.getElementById('dashboard-section').style.display = 'block';
                fetchData(); 
            } else {
                error.innerText = "رمز عبور اشتباه است!";
            }
        }

        // خروج
        function doLogout() {
            document.getElementById('login-section').style.display = 'flex';
            document.getElementById('dashboard-section').style.display = 'none';
            document.getElementById('password-input').value = '';
            document.getElementById('change-pass-box').style.display = 'none';
        }

        // نمایش/مخفی کردن فرم تغییر رمز
        function togglePassBox() {
            const box = document.getElementById('change-pass-box');
            box.style.display = box.style.display === 'none' ? 'block' : 'none';
        }

        // تغییر رمز در دیتابیس
        async function changePassword() {
            const newPass = document.getElementById('new-password').value;
            const msg = document.getElementById('pass-msg');

            if (newPass.length < 4) {
                msg.style.color = "red";
                msg.innerText = "رمز باید حداقل ۴ کاراکتر باشد!";
                return;
            }

            msg.style.color = "orange";
            msg.innerText = "در حال ذخیره...";

            // آپدیت کردن رمز در دیتابیس
            const { error } = await supabase.from('settings').update({ value: newPass }).eq('key', 'admin_password');

            if (error) {
                msg.style.color = "red";
                msg.innerText = "خطا در تغییر رمز: " + error.message;
            } else {
                msg.style.color = "green";
                msg.innerText = "✅ رمز با موفقیت در دیتابیس تغییر کرد!";
                document.getElementById('new-password').value = '';
            }
        }

        // دریافت اطلاعات
        async function fetchData() {
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '<tr class="empty-row"><td colspan="6">در حال دریافت اطلاعات...</td></tr>';

            const { data, error } = await supabase.from('members').select('*').order('created_at', { ascending: false });

            if (error) {
                tbody.innerHTML = `<tr class="empty-row"><td colspan="6" style="color:red;">خطا: ${error.message}</td></tr>`;
                return;
            }

            dataList = data;
            tbody.innerHTML = '';

            if (data.length === 0) {
                tbody.innerHTML = '<tr class="empty-row"><td colspan="6">هنوز کسی ثبت‌نام نکرده است.</td></tr>';
                return;
            }

            data.forEach((item, index) => {
                const date = new Date(item.created_at).toLocaleDateString('fa-IR');
                tbody.innerHTML += `
                    <tr>
                        <td>${index + 1}</td>
                        <td>${item.first_name}</td>
                        <td>${item.last_name}</td>
                        <td>${item.mobile}</td>
                        <td>${item.membership_type}</td>
                        <td>${date}</td>
                    </tr>
                `;
            });
        }

        // دانلود اکسل
        function downloadExcel() {
            if (dataList.length === 0) { alert("داده‌ای برای دانلود وجود ندارد!"); return; }

            const headers = ["نام", "نام خانوادگی", "کد ملی", "شماره همراه", "نوع عضویت", "تاریخ ثبت"];
            let csvContent = "\uFEFF" + headers.join(",") + "\n";

            dataList.forEach(item => {
                const date = new Date(item.created_at).toLocaleDateString('fa-IR');
                csvContent += [item.first_name, item.last_name, item.national_id, item.mobile, item.membership_type, date].join(",") + "\n";
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = "members_data.csv";
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
