<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل مدیریت</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #f1f5f9; padding: 20px; }
        .container { background: white; padding: 30px; border-radius: 16px; max-width: 1200px; margin: 0 auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { color: #1e3a8a; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 15px; border-bottom: 1px solid #e2e8f0; text-align: right; }
        th { background: #f8fafc; color: #1e3a8a; }
        .error { color: red; font-weight: bold; text-align: center; padding: 50px; font-size: 20px; }
    </style>
</head>
<body>

    <div class="container">
        <div id="error-message" class="error" style="display: none;">
            دسترسی غیرمجاز! لطفاً از طریق فرم ورود اقدام کنید.
        </div>
        <div id="content" style="display: none;">
            <h1>مدیریت ثبت‌نامی‌ها</h1>
            <table>
                <thead>
                    <tr>
                        <th>ردیف</th>
                        <th>نام</th>
                        <th>نام خانوادگی</th>
                        <th>شماره همراه</th>
                        <th>نوع عضویت</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <tr><td colspan="5" style="text-align:center;">در حال بارگذاری...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://almalzhslughrfqsthi.supabase.co'; 
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFsbWFsemhzbHVnaHJmcXN0aGlvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI3NjgxMDcsImV4cCI6MjEwODM0NDEwN30.IDFFy8WZ8r3hxlOCAwFbsOFkXuwHvvs3Sw8UeIGrc1k';
        
        // بررسی رمز در آدرس
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('pass') === '1234') {
            document.getElementById('content').style.display = 'block';
            document.getElementById('error-message').style.display = 'none';
            fetchData();
        } else {
            document.getElementById('error-message').style.display = 'block';
            document.getElementById('content').style.display = 'none';
        }

        async function fetchData() {
            const tbody = document.getElementById('table-body');
            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/members?select=*`, {
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`
                    }
                });

                if (!res.ok) {
                    throw new Error(`کد وضعیت: ${res.status}`);
                }

                const data = await res.json();
                tbody.innerHTML = '';
                if (data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">هنوز کسی ثبت‌نام نکرده است.</td></tr>';
                    return;
                }

                data.forEach((item, index) => {
                    tbody.innerHTML += `
                        <tr>
                            <td>${index + 1}</td>
                            <td>${item.first_name || '-'}</td>
                            <td>${item.last_name || '-'}</td>
                            <td>${item.mobile || '-'}</td>
                            <td>${item.membership_type || '-'}</td>
                        </tr>
                    `;
                });
            } catch (e) {
                // نمایش دقیق خطا
                tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:red;">خطای دقیق: ${e.message}</td></tr>`;
            }
        }
    </script>
</body>
</html>
