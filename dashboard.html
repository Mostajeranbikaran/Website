<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل مدیریت | داشبورد</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Vazirmatn', sans-serif; }
        body { background: #f1f5f9; min-height: 100vh; color: #0f172a; }
        
        /* هدر و منو */
        .main-header { background: #fff; border-bottom: 2px solid #e2e8f0; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; }
        h1 { color: #1e3a8a; font-size: 20px; }
        .user-info { font-size: 13px; color: #64748b; margin-top: 4px; }
        .nav-tabs { display: flex; gap: 10px; }
        .tab-btn { padding: 10px 20px; border: none; background: #f1f5f9; border-radius: 10px; font-family: inherit; font-weight: 700; color: #64748b; cursor: pointer; transition: 0.2s; }
        .tab-btn.active { background: #1e3a8a; color: #fff; }
        
        /* بدنه */
        .container { padding: 30px 20px; max-width: 1300px; margin: 0 auto; }
        .card { background: #fff; padding: 30px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); display: none; }
        .card.active { display: block; }
        
        /* دکمه‌ها */
        .btn { padding: 10px 18px; border: none; border-radius: 10px; font-weight: 700; cursor: pointer; font-family: inherit; font-size: 14px; transition: 0.2s; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-outline { background: #fff; border: 2px solid #cbd5e1; color: #0f172a; }
        .btn-outline:hover { border-color: #1e3a8a; color: #1e3a8a; }
        .btn-primary { background: #1e3a8a; color: #fff; }
        .btn-primary:hover { background: #152c6b; }
        .btn-danger { background: #ef4444; color: #fff; }
        .btn-danger:hover { background: #dc2626; }
        .btn-sm { padding: 6px 12px; font-size: 12px; }

        /* پیام‌ها */
        .status { padding: 12px 16px; border-radius: 10px; margin-bottom: 20px; font-size: 14px; font-weight: 600; display: none; }
        .status.error { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; display: block; }
        .status.success { background: #f0fdf4; color: #15803d; border: 1px solid #bbf7d0; display: block; }

        /* جدول */
        .table-wrap { overflow-x: auto; margin-top: 20px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px 14px; border-bottom: 1px solid #e2e8f0; text-align: right; font-size: 14px; }
        th { background: #f8fafc; color: #1e3a8a; font-weight: 800; }
        tr:hover td { background: #f8fafc; }
        .badge { padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight: 700; background: #eff6ff; color: #1e3a8a; }

        /* فرم‌ها */
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: 700; font-size: 14px; margin-bottom: 8px; }
        input[type="text"], textarea, input[type="file"] { width: 100%; padding: 12px; border: 2px solid #e2e8f0; border-radius: 10px; font-family: inherit; font-size: 14px; background: #f8fafc; }
        textarea { resize: vertical; min-height: 100px; }
        
        /* عکس‌ها */
        .avatar { width: 45px; height: 45px; border-radius: 8px; object-fit: cover; border: 1px solid #cbd5e1; }
        .news-img { max-width: 100px; border-radius: 8px; margin-top: 10px; display: none; }
        
        /* لودینگ */
        .spinner { display: inline-block; width: 20px; height: 20px; border: 3px solid #e2e8f0; border-top-color: #1e3a8a; border-radius: 50%; animation: spin 0.7s linear infinite; margin-left: 10px; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<header class="main-header">
    <div>
        <h1>پنل مدیریت مرکز</h1>
        <div class="user-info" id="user-info">در حال بررسی...</div>
    </div>
    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('members')">لیست ثبت‌نامی‌ها</button>
        <button class="tab-btn" onclick="switchTab('news')">مدیریت اخبار</button>
        <button class="btn btn-danger btn-sm" id="logout-btn" style="margin-right: 20px;">خروج</button>
    </div>
</header>

<div class="container">
    <div id="status" class="status"></div>

    <!-- بخش ثبت‌نامی‌ها -->
    <div id="tab-members" class="card active">
        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
            <h2>لیست ثبت‌نامی‌ها</h2>
            <div style="display:flex; gap:10px;">
                <button class="btn btn-outline" id="refresh-members-btn">↻ بروزرسانی</button>
            </div>
        </div>
        
        <div id="loading-members" style="text-align:center; padding:40px; display:none;">در حال بارگذاری <span class="spinner"></span></div>
        
        <div class="table-wrap" id="table-wrap-members" style="display:none;">
            <table>
                <thead>
                    <tr>
                        <th>ردیف</th><th>عکس</th><th>نام</th><th>نام خانوادگی</th><th>همراه</th><th>نوع عضویت</th><th>تاریخ</th><th>عملیات</th>
                    </tr>
                </thead>
                <tbody id="table-body-members"></tbody>
            </table>
        </div>
    </div>

    <!-- بخش اخبار -->
    <div id="tab-news" class="card">
        <h2>مدیریت اخبار</h2>
        
        <!-- فرم افزودن خبر -->
        <div style="background: #f8fafc; padding: 20px; border-radius: 12px; margin-top: 20px; border: 1px solid #e2e8f0;">
            <h3 style="margin-bottom: 15px; color: #1e3a8a; font-size: 16px;">افزودن خبر جدید</h3>
            <div class="form-group">
                <label>عنوان خبر</label>
                <input type="text" id="news-title" placeholder="عنوان را وارد کنید...">
            </div>
            <div class="form-group">
                <label>متن خبر</label>
                <textarea id="news-content" placeholder="متن کامل خبر..."></textarea>
            </div>
            <div class="form-group">
                <label>عکس خبر (اختیاری)</label>
                <input type="file" id="news-image" accept="image/*">
                <img id="news-image-preview" class="news-img">
            </div>
            <button class="btn btn-primary" id="add-news-btn">ثبت خبر</button>
        </div>

        <div id="loading-news" style="text-align:center; padding:40px; display:none;">در حال بارگذاری <span class="spinner"></span></div>

        <!-- لیست اخبار -->
        <div class="table-wrap" id="table-wrap-news" style="display:none; margin-top: 30px;">
            <table>
                <thead>
                    <tr>
                        <th>عکس</th><th>عنوان</th><th>تاریخ ثبت</th><th>عملیات</th>
                    </tr>
                </thead>
                <tbody id="table-body-news"></tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://almalzhslughrfqsthio.supabase.co';
const SUPABASE_KEY = 'sb_publishable_nbbnzYT0aPekZkxCaEn_Lw_OgDMBUXg';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const statusEl = document.getElementById('status');
const userInfo = document.getElementById('user-info');

// ========== ابزارها ==========
function showStatus(text, type = 'info') {
    statusEl.textContent = text;
    statusEl.className = 'status ' + type;
    setTimeout(() => statusEl.className = 'status', 5000);
}
function escapeHtml(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function formatDate(iso) {
    if (!iso) return '-';
    try { return new Date(iso).toLocaleDateString('fa-IR'); } catch { return '-'; }
}
function extractFileName(url) {
    if (!url || !url.includes('/')) return url;
    const parts = url.split('?')[0].split('/');
    return parts[parts.length - 1] || null;
}

// ========== احراز هویت ==========
async function requireAuth() {
    try {
        const { data: { session }, error } = await sb.auth.getSession();
        if (error || !session) { window.location.href = 'admin.html'; return false; }
        
        const { data: adminData } = await sb.from('admins').select('user_id').eq('user_id', session.user.id).maybeSingle();
        if (!adminData) {
            alert('شما دسترسی به پنل مدیریت ندارید.');
            await sb.auth.signOut();
            window.location.href = 'index.html';
            return false;
        }
        userInfo.textContent = 'ادمین: ' + session.user.email;
        return true;
    } catch (e) { window.location.href = 'admin.html'; return false; }
}

// ========== تغییر تب ==========
function switchTab(tab) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
    
    if (tab === 'members') {
        document.querySelector('.tab-btn:nth-child(1)').classList.add('active');
        document.getElementById('tab-members').classList.add('active');
        loadMembers();
    } else {
        document.querySelector('.tab-btn:nth-child(2)').classList.add('active');
        document.getElementById('tab-news').classList.add('active');
        loadNews();
    }
}

// ========== بارگذاری اعضا ==========
let membersData = [];
async function loadMembers() {
    const loader = document.getElementById('loading-members');
    const wrap = document.getElementById('table-wrap-members');
    const tbody = document.getElementById('table-body-members');
    
    loader.style.display = 'block'; wrap.style.display = 'none';
    
    try {
        const { data, error } = await sb.from('members').select('*').order('created_at', { ascending: false });
        if (error) throw error;
        
        membersData = data;
        tbody.innerHTML = '';
        
        if (!data.length) {
            tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;">هنوز کسی ثبت‌نام نکرده است.</td></tr>';
        } else {
            data.forEach((item, i) => {
                tbody.innerHTML += `
                    <tr>
                        <td>${i + 1}</td>
                        <td class="photo-cell" id="m-photo-${item.id}">...</td>
                        <td>${escapeHtml(item.first_name)}</td>
                        <td>${escapeHtml(item.last_name)}</td>
                        <td dir="ltr">${escapeHtml(item.mobile)}</td>
                        <td><span class="badge">${escapeHtml(item.membership_type)}</span></td>
                        <td>${formatDate(item.created_at)}</td>
                        <td>
                            <button class="btn btn-primary btn-sm" onclick="printMember('${item.id}')">🖨️ چاپ فرم</button>
                        </td>
                    </tr>
                `;
            });
            
            // لود عکس‌ها
            data.forEach(async (item) => {
                const cell = document.getElementById(`m-photo-${item.id}`);
                const fileName = extractFileName(item.photo_url);
                if (!fileName) { cell.innerHTML = '—'; return; }
                const { data: urlData } = await sb.storage.from('photos').createSignedUrl(fileName, 3600);
                if (urlData) cell.innerHTML = `<img src="${urlData.signedUrl}" class="avatar">`;
                else cell.innerHTML = '✕';
            });
        }
        wrap.style.display = 'block';
    } catch (e) {
        showStatus('خطا در بارگذاری لیست: ' + e.message, 'error');
    } finally {
        loader.style.display = 'none';
    }
}

// ========== چاپ فرم تکی (برای هر شخص) ==========
async function printMember(id) {
    const person = membersData.find(m => m.id == id);
    if (!person) return;

    let photoHTML = '<p>بدون عکس</p>';
    const fileName = extractFileName(person.photo_url);
    if (fileName) {
        const { data } = await sb.storage.from('photos').createSignedUrl(fileName, 3600);
        if (data) photoHTML = `<img src="${data.signedUrl}" style="width:120px; height:120px; object-fit:cover; border-radius:8px; border:1px solid #ccc;">`;
    }

    // ساخت پنجره جدید برای چاپ
    const printWindow = window.open('', '_blank');
    printWindow.document.write(`
        <html dir="rtl">
        <head>
            <title>فرم ${person.first_name} ${person.last_name}</title>
            <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
            <style>
                body { font-family: 'Vazirmatn', sans-serif; padding: 20px; color: #000; }
                h2 { text-align: center; border-bottom: 2px solid #333; padding-bottom: 10px; }
                table { width: 100%; border-collapse: collapse; margin-top: 20px; }
                th, td { border: 1px solid #999; padding: 8px 12px; text-align: right; font-size: 14px; }
                th { background: #f0f0f0; width: 25%; }
                .photo-box { text-align: center; margin-top: 20px; }
                @media print {
                    body { -webkit-print-color-adjust: exact; }
                }
            </style>
        </head>
        <body>
            <h2>فرم ثبت‌نام - مرکز توانمندسازی</h2>
            <div class="photo-box">
                ${photoHTML}
            </div>
            <table>
                <tr><th>نام</th><td>${escapeHtml(person.first_name || '-')}</td></tr>
                <tr><th>نام خانوادگی</th><td>${escapeHtml(person.last_name || '-')}</td></tr>
                <tr><th>کد ملی</th><td>${escapeHtml(person.national_id || '-')}</td></tr>
                <tr><th>تاریخ تولد</th><td>${escapeHtml(person.birth_date || '-')}</td></tr>
                <tr><th>وضعیت تاهل</th><td>${escapeHtml(person.marital_status || '-')}</td></tr>
                <tr><th>تعداد فرزندان</th><td>${escapeHtml(person.children || '-')}</td></tr>
                <tr><th>شماره همراه</th><td>${escapeHtml(person.mobile || '-')}</td></tr>
                <tr><th>تلفن ثابت</th><td>${escapeHtml(person.landline || '-')}</td></tr>
                <tr><th>نشانی</th><td>${escapeHtml(person.address || '-')}</td></tr>
                <tr><th>کد پستی</th><td>${escapeHtml(person.postal_code || '-')}</td></tr>
                <tr><th>وضعیت مسکن</th><td>${escapeHtml(person.housing_status || '-')}</td></tr>
                <tr><th>شغل</th><td>${escapeHtml(person.job || '-')}</td></tr>
                <tr><th>تحصیلات</th><td>${escapeHtml(person.education || '-')}</td></tr>
                <tr><th>کد بیمه</th><td>${escapeHtml(person.social_security || '-')}</td></tr>
                <tr><th>بیمه تکمیلی</th><td>${escapeHtml(person.supplementary_insurance || '-')}</td></tr>
                <tr><th>نوع عضویت</th><td>${escapeHtml(person.membership_type || '-')}</td></tr>
                <tr><th>تاریخ ثبت فرم</th><td>${formatDate(person.created_at)}</td></tr>
            </table>
            <script>
                window.onload = function() {
                    setTimeout(() => { window.print(); }, 500);
                }
            <\/script>
        </body>
        </html>
    `);
    printWindow.document.close();
}

// ========== مدیریت اخبار ==========
async function loadNews() {
    const loader = document.getElementById('loading-news');
    const wrap = document.getElementById('table-wrap-news');
    const tbody = document.getElementById('table-body-news');
    
    loader.style.display = 'block'; wrap.style.display = 'none';
    
    try {
        const { data, error } = await sb.from('news').select('*').order('created_at', { ascending: false });
        if (error) throw error;
        
        tbody.innerHTML = '';
        if (!data.length) {
            tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">هیچ خبری ثبت نشده است.</td></tr>';
        } else {
            data.forEach(item => {
                tbody.innerHTML += `
                    <tr>
                        <td class="news-photo-cell" id="n-photo-${item.id}">...</td>
                        <td><strong>${escapeHtml(item.title)}</strong><br><small>${escapeHtml(item.content).substring(0, 50)}...</small></td>
                        <td>${formatDate(item.created_at)}</td>
                        <td><button class="btn btn-danger btn-sm" onclick="deleteNews('${item.id}')">حذف</button></td>
                    </tr>
                `;
            });

            data.forEach(async (item) => {
                const cell = document.getElementById(`n-photo-${item.id}`);
                const fileName = extractFileName(item.photo_url);
                if (!fileName) { cell.innerHTML = '—'; return; }
                const { data: urlData } = await sb.storage.from('photos').createSignedUrl(fileName, 3600);
                if (urlData) cell.innerHTML = `<img src="${urlData.signedUrl}" class="avatar">`;
                else cell.innerHTML = '✕';
            });
        }
        wrap.style.display = 'block';
    } catch (e) {
        showStatus('خطا در بارگذاری اخبار: ' + e.message, 'error');
    } finally {
        loader.style.display = 'none';
    }
}

// پیش‌نمایش عکس خبر
document.getElementById('news-image').addEventListener('change', (e) => {
    const file = e.target.files[0];
    const preview = document.getElementById('news-image-preview');
    if (file) {
        preview.src = URL.createObjectURL(file);
        preview.style.display = 'block';
    } else {
        preview.style.display = 'none';
    }
});

// ثبت خبر جدید
document.getElementById('add-news-btn').addEventListener('click', async () => {
    const title = document.getElementById('news-title').value.trim();
    const content = document.getElementById('news-content').value.trim();
    const file = document.getElementById('news-image').files[0];
    const btn = document.getElementById('add-news-btn');

    if (!title || !content) { showStatus('لطفاً عنوان و متن خبر را وارد کنید.', 'error'); return; }
    
    btn.disabled = true; btn.textContent = 'در حال ثبت...';
    
    try {
        let photoUrl = null;
        if (file) {
            const fileExt = file.name.split('.').pop();
            const fileName = `news-${Date.now()}.${fileExt}`;
            const { error: uploadErr } = await sb.storage.from('photos').upload(fileName, file);
            if (uploadErr) throw new Error('خطا در آپلود عکس: ' + uploadErr.message);
            photoUrl = fileName;
        }

        const { error } = await sb.from('news').insert([{ title, content, photo_url: photoUrl }]);
        if (error) throw error;

        showStatus('خبر با موفقیت ثبت شد!', 'success');
        
        document.getElementById('news-title').value = '';
        document.getElementById('news-content').value = '';
        document.getElementById('news-image').value = '';
        document.getElementById('news-image-preview').style.display = 'none';
        
        loadNews();
    } catch (e) {
        showStatus(e.message, 'error');
    } finally {
        btn.disabled = false; btn.textContent = 'ثبت خبر';
    }
});

// حذف خبر
async function deleteNews(id) {
    if (!confirm('آیا از حذف این خبر مطمئن هستید؟')) return;
    try {
        const { error } = await sb.from('news').delete().eq('id', id);
        if (error) throw error;
        showStatus('خبر حذف شد.', 'success');
        loadNews();
    } catch (e) {
        showStatus('خطا در حذف: ' + e.message, 'error');
    }
}

// ========== خروج ==========
document.getElementById('logout-btn').addEventListener('click', async () => {
    try { await sb.auth.signOut(); } catch (e) {}
    window.location.href = 'admin.html';
});

document.getElementById('refresh-members-btn').addEventListener('click', loadMembers);

// شروع
(async () => {
    if (await requireAuth()) {
        loadMembers();
    }
})();
</script>
</body>
</html>
