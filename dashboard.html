<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>داشبورد | پنل مدیریت</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Vazirmatn', sans-serif; }
        body { background: #f1f5f9; min-height: 100vh; padding: 20px; color: #0f172a; }
        .container { background: #fff; padding: 30px; border-radius: 16px; max-width: 1200px; margin: 0 auto; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #e2e8f0; padding-bottom: 15px; margin-bottom: 20px; }
        .header h1 { color: #1e3a8a; font-size: 22px; }
        .logout-btn { background: #ef4444; color: white; padding: 8px 16px; border: none; border-radius: 8px; text-decoration: none; font-weight: bold; font-size: 14px; }
        
        /* دکمه‌های اکسل و PDF */
        .btn-sm { padding: 6px 10px; border-radius: 6px; border: none; cursor: pointer; font-size: 12px; font-weight: bold; color: white; margin-left: 4px; }
        .btn-excel { background: #10b981; }
        .btn-pdf { background: #ef4444; }

        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px 14px; border-bottom: 1px solid #e2e8f0; text-align: right; font-size: 14px; }
        th { background: #f8fafc; color: #1e3a8a; font-weight: 800; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>لیست ثبت‌نامی‌ها</h1>
        <button onclick="logout()" class="logout-btn">خروج</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>ردیف</th>
                <th>نام</th>
                <th>نام خانوادگی</th>
                <th>شماره همراه</th>
                <th>عملیات</th>
            </tr>
        </thead>
        <tbody id="table-body">
            <tr><td colspan="5" style="text-align:center; padding:30px;">در حال بارگذاری...</td></tr>
        </tbody>
    </table>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    // ====== کلید مشترک ======
    const SUPABASE_URL = 'https://almalzhslughrfqsthi.supabase.co'; 
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFsbWFsemhzbHVnaHJmcXN0aGlvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI3NjgxMDcsImV4cCI6MjEwODM0NDEwN30.IDFFy8WZ8r3hxlOCAwFbsOFkXuwHvvs3Sw8UeIGrc1k';
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let membersList = [];

    // ====== چک کردن لاگین (بدون حلقه) ======
    async function init() {
        const { data: { session } } = await sb.auth.getSession();
        if (!session) {
            // اگر لاگین نبود، بفرست به صفحه ورود
            window.location.href = 'admin.html';
            return;
        }
        // اگر لاگین بود، اطلاعات رو لود کن
        loadData();
    }

    // ====== خروج ======
    async function logout() {
        await sb.auth.signOut();
        window.location.href = 'admin.html';
    }

    // ====== لود کردن اطلاعات ======
    async function loadData() {
        const tbody = document.getElementById('table-body');
        try {
            const { data, error } = await sb.from('members').select('*').order('created_at', { ascending: false });
            if (error) throw error;

            membersList = data;
            tbody.innerHTML = '';

            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding:30px; color:#64748b;">هنوز کسی ثبت‌نام نکرده است.</td></tr>';
                return;
            }

            data.forEach((item, index) => {
                tbody.innerHTML += `
                    <tr>
                        <td>${index + 1}</td>
                        <td>${item.first_name || '-'}</td>
                        <td>${item.last_name || '-'}</td>
                        <td>${item.mobile || '-'}</td>
                        <td>
                            <button class="btn-sm btn-excel" onclick="downloadExcel(${index})"><i class="fas fa-file-excel"></i></button>
                            <button class="btn-sm btn-pdf" onclick="downloadPDF(${index})"><i class="fas fa-file-pdf"></i></button>
                        </td>
                    </tr>
                `;
            });
        } catch (error) {
            tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:red;">خطا: ${error.message}</td></tr>`;
        }
    }

    // ====== دانلود اکسل ======
    function downloadExcel(index) {
        const m = membersList[index];
        let csv = "\uFEFFنام,نام خانوادگی,شماره همراه\n";
        csv += `${m.first_name},${m.last_name},${m.mobile}\n`;
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = `${m.first_name}_${m.last_name}.csv`;
        link.click();
    }

    // ====== دانلود PDF ======
    function downloadPDF(index) {
        const m = membersList[index];
        const win = window.open('', '', 'height=600,width=800');
        win.document.write('<html><head><title>فرم</title><style>body{font-family:Tahoma; direction:rtl; padding:30px;} table{width:100%; border-collapse:collapse;} th,td{border:1px solid #ccc; padding:10px; text-align:right;}</style></head><body>');
        win.document.write(`<h2>فرم ثبت‌نام: ${m.first_name} ${m.last_name}</h2>`);
        win.document.write('<table><tr><th>نام</th><td>' + m.first_name + '</td></tr>');
        win.document.write('<tr><th>نام خانوادگی</th><td>' + m.last_name + '</td></tr>');
        win.document.write('<tr><th>شماره همراه</th><td>' + m.mobile + '</td></tr></table>');
        win.document.write('</body></html>');
        win.document.close();
        setTimeout(() => { win.print(); win.close(); }, 500);
    }

    // شروع
    init();
</script>
</body>
</html>
