<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل مدیریت</title>
    <!-- استایل‌ها به صورت مستقیم و بدون فایل خارجی -->
    <style>
        body { background-color: #f1f5f9; font-family: Tahoma, sans-serif; padding: 20px; margin: 0; }
        .container { max-width: 1200px; margin: 0 auto; background: white; padding: 30px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        h1 { color: #1e3a8a; margin-top: 0; font-size: 24px; }
        .btn { background: #10b981; color: white; padding: 12px 24px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-bottom: 20px; font-size: 15px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; min-width: 800px; }
        th, td { padding: 15px; border-bottom: 1px solid #e2e8f0; text-align: right; }
        th { background: #f8fafc; color: #1e3a8a; }
        .error { color: red; font-weight: bold; text-align: center; padding: 50px; font-size: 20px; }
        .table-wrapper { overflow-x: auto; }
    </style>
</head>
<body>

    <div class="container">
        <!-- پیام خطا (اگر رمز درست نبود) -->
        <div id="error-message" class="error" style="display: none;">
            دسترسی غیرمجاز! لطفاً از طریق فرم ورود (admin.html) اقدام کنید.
        </div>

        <!-- محتوای جدول -->
        <div id="content" style="display: none;">
            <h1>مدیریت ثبت‌نامی‌ها</h1>
            <button onclick="window.location.reload()" class="btn">🔄 بروزرسانی لیست</button>
            
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>ردیف</th>
                            <th>نام</th>
                            <th>نام خانوادگی</th>
                            <th>شماره همراه</th>
                            <th>نوع عضویت</th>
                            <th>تاریخ ثبت</th>
                        </tr>
                    </thead>
                    <tbody id="table-body">
                        <tr><td colspan="6" style="text-align:center;">در حال دریافت اطلاعات از دیتابیس...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // ====== اطلاعات اتصال ======
        const SUPABASE_URL = 'https://almalzhslughrfqsthi.supabase.co'; 
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFsbWFsemhzbHVnaHJmcXN0aGlvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI3NjgxMDcsImV4cCI6MjEwODM0NDEwN30.IDFFy8WZ8r3hxlOCAwFbsOFkXuwHvvs3Sw8UeIGrc1k';
        
        // ====== بررسی آدرس ======
        const urlParams = new URLSearchParams(window.location.search);
        const pass = urlParams.get('pass');

        if (pass === '1234') {
            document.getElementById('content').style.display = 'block';
            document.getElementById('error-message').style.display = 'none';
            fetchDataDirectly(); // شروع دریافت اطلاعات
        } else {
            document.getElementById('error-message').style.display = 'block';
            document.getElementById('content').style.display = 'none';
        }

        // ====== دریافت اطلاعات با API مستقیم (بدون خطا) ======
        async function fetchDataDirectly() {
            const tbody = document.getElementById('table-body');
            
            try {
                // درخواست مستقیم به API Supabase
                const response = await fetch(`${SUPABASE_URL}/rest/v1/members?select=*&order=created_at.desc`, {
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`
                    }
                });

                if (!response.ok) {
                    throw new Error("خطا در اتصال به دیتابیس");
                }

                const data = await response.json();
                tbody.innerHTML = '';

                if (data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">هنوز کسی ثبت‌نام نکرده است.</td></tr>';
                    return;
                }

                data.forEach((item, index) => {
                    const date = item.created_at ? new Date(item.created_at).toLocaleDateString('fa-IR') : '-';
                    tbody.innerHTML += `
                        <tr>
                            <td>${index + 1}</td>
                            <td>${item.first_name || '-'}</td>
                            <td>${item.last_name || '-'}</td>
                            <td>${item.mobile || '-'}</td>
                            <td>${item.membership_type || '-'}</td>
                            <td>${date}</td>
                        </tr>
                    `;
                });

            } catch (error) {
                tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:red;">خطا در دریافت اطلاعات: ${error.message}</td></tr>`;
            }
        }
    </script>
</body>
</html>
